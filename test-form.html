
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Form</title>
</head>
<body>

  <form id="contact">
    <input type="text" name="name" placeholder="Name">
    <input type="email" name="email" placeholder="Email">
    <input type="text" name="subject" placeholder="Subject">
    <textarea name="message" placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>

  <script>
    document.querySelector("#contact").addEventListener("submit", async (e) => {
      e.preventDefault();

      const form = e.target;
      const data = Object.fromEntries(new FormData(form));

      try {
        const response = await fetch("https://uylyzrgro6uzxmjji4riykdrru0tyshm.lambda-url.us-east-1.on.aws/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        alert(response.ok ? "Message sent" : "Submission failed");
      } catch (error) {
        alert("Submission failed");
        console.error(error);
      }
    });
  </script>

</body>
</html>
