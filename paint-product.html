<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Custom Acrylic Paint | OEM Paint</title>
    <meta name="description" content="Custom-manufactured acrylic paint for OEM and private-label packaging.">
    <link rel="stylesheet" href="paint-product.css">
    <script src="paint-product.js" defer></script>
  </head>
  <body>
    <main class="product-page" aria-labelledby="product-title">
      <article class="product-panel">
        <section class="product-gallery" aria-label="Product image gallery">
          <div class="gallery-main">
            <img
              id="mainProductImage"
              src="assets/500_ml_Bottle_Test_0000_500_ml_Bottle_Label_Bluie_Paint_Test.png"
              alt="Custom acrylic paint bottle with private-label packaging"
              class="gallery-main-image">
          </div>

          <div class="gallery-thumbnails" aria-label="Choose product image">
            <button class="gallery-thumbnail is-selected" type="button" aria-label="Show labelled acrylic paint bottle" aria-current="true">
              <img src="assets/500_ml_Bottle_Test_0000_500_ml_Bottle_Label_Bluie_Paint_Test.png" alt="">
            </button>
            <button class="gallery-thumbnail" type="button" aria-label="Show unlabelled blue acrylic paint bottle">
              <img src="assets/500_ml_Bottle_Test_0003_500_ml_Bottle_Bluie_Paint_Test.png" alt="">
            </button>
            <button class="gallery-thumbnail" type="button" aria-label="Show artist paint materials">
              <img src="assets/original-1B355DE7-DC09-4127-B929-4739C6C4D9B3.jpeg" alt="">
            </button>
            <button class="gallery-thumbnail" type="button" aria-label="Show coloured powder paint">
              <img src="assets/powder1.png" alt="">
            </button>
          </div>
        </section>

        <section class="product-summary">
          <p class="product-eyebrow">OEM PAINT</p>
          <h1 id="product-title">Custom Acrylic Paint</h1>
          <p class="product-description">Custom-manufactured acrylic paint available in your choice of colours, finishes, pack sizes and private-label packaging.</p>
          <a class="quote-button" href="index.html#quote">
            <span>Request a Quote</span>
            <span aria-hidden="true">-&gt;</span>
          </a>
        </section>
      </article>
    </main>
  </body>
</html>
